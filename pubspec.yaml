name: confessions
description: "Listen and share your confessions"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audio_session: ^0.2.3
  cloud_firestore: any
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  firebase_analytics: ^12.4.0
  firebase_auth: any
  firebase_core: ^4.8.0
  firebase_crashlytics: ^5.2.1
  firebase_messaging: ^16.2.1
  firebase_performance: ^0.11.4
  firebase_remote_config: ^6.5.0
  firebase_storage: any
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_vector_icons: ^2.0.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.12
  path: ^1.9.1
  path_provider: ^2.1.5
  purchases_flutter: ^8.11.0
  purchases_ui_flutter: ^8.11.0
  record: ^6.2.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/legal/
    - .env
